<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
  <!-- Horizon scene: striped pastel sun behind glowing wireframe mountains.
       Bottom edge sits on the horizon; the sky colour and grids come from CSS.
       Mountains generated by a small script, so they stay consistent. -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6fd"/>
      <stop offset="0.45" stop-color="#ffc2ec"/>
      <stop offset="0.8" stop-color="#ff6ad5"/>
      <stop offset="1" stop-color="#c13fd6"/>
    </linearGradient>
    <mask id="stripes">
      <rect x="0" y="0" width="1600" height="600" fill="#fff"/>
      <g fill="#000">
        <rect x="0" y="452" width="1600" height="5"/><rect x="0" y="484" width="1600" height="7"/>
        <rect x="0" y="514" width="1600" height="9"/><rect x="0" y="543" width="1600" height="12"/>
        <rect x="0" y="572" width="1600" height="15"/>
      </g>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="lineglow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- stars -->
  <g fill="#fff" opacity="0.65">
    <circle cx="120" cy="60" r="1.6"/><circle cx="260" cy="140" r="1.2"/><circle cx="420" cy="40" r="1.4"/>
    <circle cx="560" cy="190" r="1"/><circle cx="700" cy="90" r="1.5"/><circle cx="880" cy="30" r="1.2"/>
    <circle cx="1010" cy="170" r="1.4"/><circle cx="1150" cy="70" r="1.1"/><circle cx="1290" cy="150" r="1.6"/>
    <circle cx="1450" cy="50" r="1.3"/><circle cx="1530" cy="210" r="1"/><circle cx="60" cy="260" r="1.1"/>
  </g>

  <!-- neon outline triangles behind the sun, slightly out of register -->
  <g fill="none" stroke-linejoin="round" filter="url(#lineglow)">
    <polygon points="800,70 1110,600 490,600" stroke="#ffe66d" stroke-width="4" opacity="0.8" transform="rotate(-7 800 420)"/>
    <polygon points="800,70 1110,600 490,600" stroke="#ff6ad5" stroke-width="4" opacity="0.9" transform="rotate(-3.5 800 420)"/>
    <polygon points="800,70 1110,600 490,600" stroke="#8a5cff" stroke-width="5"/>
  </g>

  <!-- sun: soft glow, then the striped disc sitting on the horizon -->
  <circle cx="800" cy="600" r="250" fill="#ff6ad5" opacity="0.45" filter="url(#glow)"/>
  <circle cx="800" cy="600" r="225" fill="url(#sun)" mask="url(#stripes)"/>
